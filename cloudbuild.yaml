# Cloud Build config for the CFO Content Engine image.
#
# Triggered manually today:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Outputs an image tagged :latest AND :commit-<sha>, pushed to Artifact
# Registry. A subsequent `gcloud run deploy` picks up :latest.

substitutions:
  _REGION: us-west2
  _REPO: cfo-engine
  _IMAGE: cfo-engine
  _SHORT_SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Build with BuildKit + layer caching (pulls :latest if present).
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - buildx
      - build
      - --platform=linux/amd64
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_SHORT_SHA}
      - --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - --cache-to=type=inline
      - --push
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_SHORT_SHA}

timeout: 1200s
